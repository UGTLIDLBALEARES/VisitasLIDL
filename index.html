<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visitas LIDL Baleares — UGT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f8f8f6;color:#1a1a1a}
#app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e5e5e0;background:#fff;flex-shrink:0}
.toolbar-logo{display:flex;align-items:center;gap:8px;margin-right:4px}
.toolbar-logo .dot{width:28px;height:28px;border-radius:50%;background:#1D9E75;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.toolbar-logo span{font-weight:600;font-size:14px;color:#1a1a1a}
.toolbar input[type=week]{padding:6px 10px;border:1px solid #d0d0ca;border-radius:8px;font-size:13px;background:#fff;color:#1a1a1a;font-family:inherit}
.btn{padding:6px 14px;border:1px solid #d0d0ca;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;background:#fff;color:#1a1a1a;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:background 0.15s}
.btn:hover{background:#f0f0ec}
.btn-green{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-green:hover{background:#0F6E56}
.btn-red{background:#fff0f0;color:#A32D2D;border-color:#f0c0c0;padding:2px 8px;font-size:11px}
.btn-red:hover{background:#fce4d6}
.mode-badge{padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:0.02em}
.mode-admin{background:#FAEEDA;color:#633806}
.mode-pub{background:#E1F5EE;color:#085041}
#map{flex:1;min-height:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;padding:6px 14px;border-top:1px solid #e5e5e0;background:#fff;flex-shrink:0}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#666}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bottom{display:flex;border-top:1px solid #e5e5e0;height:300px;flex-shrink:0;overflow:hidden}
.panel-left{width:210px;flex-shrink:0;border-right:1px solid #e5e5e0;padding:10px;background:#fff;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.panel-left h4{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.delegado-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #f0f0ec}
.delegado-row:last-of-type{border-bottom:none}
.d-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.d-name{flex:1;font-size:13px}
.d-count{font-size:11px;color:#aaa;min-width:20px;text-align:right}
.add-del{display:flex;gap:6px;margin-top:10px}
.add-del input{flex:1;padding:5px 8px;border:1px solid #d0d0ca;border-radius:8px;font-size:12px;background:#fff;color:#1a1a1a;font-family:inherit}
.panel-right{flex:1;padding:10px 14px;overflow-y:auto;background:#f8f8f6}
.panel-right h4{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:6px}
.tcard{background:#fff;border:1px solid #e5e5e0;border-radius:10px;padding:8px 10px}
.tcard-name{font-size:13px;font-weight:600;color:#1a1a1a;margin-bottom:1px}
.tcard-code{font-size:11px;color:#aaa;margin-bottom:6px}
.tcard select,.tcard input[type=date]{width:100%;padding:4px 7px;border:1px solid #d0d0ca;border-radius:7px;font-size:12px;background:#fff;color:#1a1a1a;font-family:inherit;margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;min-height:22px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer}
.chip-x{opacity:0.55;margin-left:1px}
.chip:hover .chip-x{opacity:1}
.visited-row{display:flex;align-items:center;gap:5px;font-size:12px;color:#666;cursor:pointer;margin-top:2px}
.visited-row input{cursor:pointer}
.stats-bar{display:flex;gap:14px;margin-left:auto;align-items:center}
.stat-item{text-align:center}
.stat-n{font-size:20px;font-weight:600;line-height:1}
.stat-l{font-size:10px;color:#aaa;margin-top:1px}
.filter-del{padding:5px 9px;border:1px solid #d0d0ca;border-radius:8px;font-size:12px;background:#fff;color:#1a1a1a;font-family:inherit}
.empty-msg{font-size:13px;color:#aaa;padding:12px 0}
/* Leaflet popup */
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 16px rgba(0,0,0,0.12)!important}
</style>
</head>
<body>
<div id="app">

  <div class="toolbar">
    <div class="toolbar-logo">
      <div class="dot">U</div>
      <span>Visitas LIDL · BAL</span>
    </div>
    <span class="mode-badge mode-admin" id="mode-badge">Modo admin</span>
    <label style="font-size:12px;color:#888">Semana:</label>
    <input type="week" id="semana-input">
    <select class="filter-del" id="filtro-del"><option value="">Todos los delegados</option></select>
    <button class="btn" id="btn-modo" onclick="toggleModo()">Vista pública</button>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-n" id="st-asig">0</div><div class="stat-l">asignadas</div></div>
      <div class="stat-item"><div class="stat-n" id="st-pend">31</div><div class="stat-l">pendientes</div></div>
      <div class="stat-item"><div class="stat-n" style="color:#1D9E75" id="st-visit">0</div><div class="stat-l">visitadas</div></div>
    </div>
  </div>

  <div id="map"></div>
  <div class="legend" id="legend"></div>

  <div class="bottom">
    <div class="panel-left">
      <h4>Delegados</h4>
      <div id="del-list"></div>
      <div class="add-del" id="add-del-form">
        <input id="new-del-input" placeholder="Nombre..." maxlength="30" onkeydown="if(event.key==='Enter')addDelegado()">
        <button class="btn btn-green" onclick="addDelegado()" style="padding:5px 11px;font-size:13px">+</button>
      </div>
    </div>
    <div class="panel-right">
      <h4 id="panel-title">Asignar tiendas</h4>
      <div class="cards-grid" id="cards-grid"></div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TIENDAS=[
  {id:272,name:"Cas Capiscol",lat:39.592,lng:2.667},
  {id:2025,name:"Campos",lat:39.427,lng:3.018},
  {id:2063,name:"Marratxí",lat:39.608,lng:2.745},
  {id:2038,name:"Paguera",lat:39.536,lng:2.462},
  {id:2146,name:"Magaluf",lat:39.510,lng:2.527},
  {id:931,name:"Ciutadella",lat:40.002,lng:3.833},
  {id:2080,name:"Mahon",lat:39.888,lng:4.261},
  {id:2034,name:"Sa Pobla",lat:39.767,lng:3.017},
  {id:2115,name:"Can Picafort",lat:39.762,lng:3.159},
  {id:361,name:"Inca",lat:39.719,lng:2.910},
  {id:2003,name:"Alcudia",lat:39.852,lng:3.121},
  {id:2027,name:"Pollença",lat:39.878,lng:3.014},
  {id:2158,name:"Inca II",lat:39.725,lng:2.906},
  {id:280,name:"Palmanova",lat:39.525,lng:2.540},
  {id:2045,name:"La Vileta",lat:39.580,lng:2.629},
  {id:2061,name:"Can Domenge",lat:39.568,lng:2.660},
  {id:2024,name:"Felanitx",lat:39.469,lng:3.149},
  {id:2068,name:"Santanyí",lat:39.361,lng:3.127},
  {id:2155,name:"Manacor Academy",lat:39.709,lng:3.210},
  {id:295,name:"Son Fuster",lat:39.596,lng:2.683},
  {id:2075,name:"Can Bufí",lat:39.571,lng:2.636},
  {id:2132,name:"Av. Méjico",lat:39.563,lng:2.648},
  {id:2136,name:"Aragón",lat:39.574,lng:2.657},
  {id:291,name:"Manacor",lat:39.706,lng:3.218},
  {id:919,name:"Capdepera",lat:39.710,lng:3.437},
  {id:932,name:"Cala Millor",lat:39.597,lng:3.384},
  {id:910,name:"Sant Antoni",lat:38.980,lng:1.300},
  {id:2057,name:"Ibiza",lat:38.909,lng:1.430},
  {id:2033,name:"Palma-Ikea",lat:39.601,lng:2.720},
  {id:2079,name:"Arenal",lat:39.506,lng:2.737},
  {id:2094,name:"Cardenal Rossell",lat:39.545,lng:2.696},
];

const PALETTE=["#378ADD","#1D9E75","#D85A30","#D4537E","#7F77DD","#BA7517","#E24B4A","#085041","#712B13","#3C3489","#27500A","#633806","#A32D2D","#0C447C","#3B6D11","#854F0B"];

let modo="admin",semana="",asig={},delegados=[],markers={},map;

const sk=s=>'lidl_v2_'+s;
const dsk=()=>'lidl_v2_delegados';

function load(){
  const r=localStorage.getItem(sk(semana));
  asig=r?JSON.parse(r):{};
  const d=localStorage.getItem(dsk());
  delegados=d?JSON.parse(d):["Luis","Cati","Yolanda","Cristina","Marisa","Tomeu","Jordi","Salva"];
}

function save(){
  localStorage.setItem(sk(semana),JSON.stringify(asig));
  localStorage.setItem(dsk(),JSON.stringify(delegados));
}

function color(name){
  const i=delegados.indexOf(name);
  return i>=0?PALETTE[i%PALETTE.length]:"#B4B2A9";
}

function textColor(bg){
  const r=parseInt(bg.slice(1,3),16),g=parseInt(bg.slice(3,5),16),b=parseInt(bg.slice(5,7),16);
  return(r*299+g*587+b*114)/1000>145?"#1a1a1a":"#ffffff";
}

function getWeekStr(){
  const now=new Date(),y=now.getFullYear(),jan4=new Date(y,0,4);
  const w=Math.ceil(((now-jan4)/86400000+jan4.getDay()+1)/7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}

function makeIcon(t){
  const a=asig[t.id]||{},dels=a.delegados||[],visited=a.visitada,n=dels.length;
  if(n===0){
    const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='28' height='34' viewBox='0 0 28 34'><path d='M14 0C6.268 0 0 6.268 0 14c0 8.837 14 20 14 20S28 22.837 28 14C28 6.268 21.732 0 14 0z' fill='#C8C8C0' stroke='#fff' stroke-width='1.5'/><circle cx='14' cy='13' r='5' fill='rgba(255,255,255,0.35)'/></svg>`;
    return L.divIcon({html:svg,iconSize:[28,34],iconAnchor:[14,34],popupAnchor:[0,-36],className:''});
  }
  const segs=Math.min(n,4),sw=30+Math.max(0,segs-1)*7;
  let rects='';
  dels.slice(0,4).forEach((d,i)=>{rects+=`<rect x='${i*(sw/segs)}' y='0' width='${sw/segs+1}' height='30' fill='${color(d)}'/>`;});
  const check=visited?`<text x='${sw/2}' y='20' text-anchor='middle' font-size='13' fill='white' font-family='sans-serif' font-weight='bold'>✓</text>`:'';
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='${sw}' height='38' viewBox='0 0 ${sw} 38'>
    <defs><clipPath id='c${t.id}'><path d='M${sw/2} 0C${sw*.18} 0 0 ${sw*.18} 0 ${sw*.44}c0 ${sw*.36} ${sw/2} ${sw*.56+6} ${sw/2} ${sw*.56+6}s${sw/2}-${sw*.2} ${sw/2}-${sw*.56+6}C${sw} ${sw*.18} ${sw*.82} 0 ${sw/2} 0z'/></clipPath></defs>
    <path d='M${sw/2} 0C${sw*.18} 0 0 ${sw*.18} 0 ${sw*.44}c0 ${sw*.36} ${sw/2} ${sw*.56+6} ${sw/2} ${sw*.56+6}s${sw/2}-${sw*.2} ${sw/2}-${sw*.56+6}C${sw} ${sw*.18} ${sw*.82} 0 ${sw/2} 0z' fill='${color(dels[0])}' stroke='${visited?"#0F6E56":"#fff"}' stroke-width='${visited?3:2}'/>
    <g clip-path='url(#c${t.id})'>${rects}</g>${check}
  </svg>`;
  return L.divIcon({html:svg,iconSize:[sw,38],iconAnchor:[sw/2,38],popupAnchor:[0,-40],className:''});
}

function popupHtml(t){
  const a=asig[t.id]||{},dels=a.delegados||[];
  const chips=dels.map(d=>{const c=color(d);return `<span style='background:${c};color:${textColor(c)};padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;margin:2px;display:inline-block'>${d}</span>`;}).join('');
  return `<div style='min-width:170px;font-family:system-ui,sans-serif'>
    <div style='font-weight:700;font-size:14px;margin-bottom:2px;color:#1a1a1a'>${t.name}</div>
    <div style='font-size:11px;color:#aaa;margin-bottom:8px'>Código: ${t.id}</div>
    ${dels.length?`<div style='margin-bottom:6px'>${chips}</div>`:'<div style="font-size:12px;color:#bbb;margin-bottom:6px">Sin asignar</div>'}
    ${a.dia?`<div style='font-size:12px;color:#555;margin-top:2px'>📅 ${formatDate(a.dia)}</div>`:''}
    ${a.visitada?`<div style='font-size:12px;color:#1D9E75;font-weight:700;margin-top:5px'>✓ Visitada</div>`:''}
  </div>`;
}

function formatDate(s){
  if(!s)return'';
  const [y,m,d]=s.split('-');
  const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return `${d} ${months[parseInt(m)-1]} ${y}`;
}

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([39.65,2.95],9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
  TIENDAS.forEach(t=>{
    const m=L.marker([t.lat,t.lng],{icon:makeIcon(t)}).addTo(map);
    m.bindPopup(popupHtml(t));
    markers[t.id]=m;
  });
}

function refreshMarkers(){
  TIENDAS.forEach(t=>{
    if(!markers[t.id])return;
    markers[t.id].setIcon(makeIcon(t));
    markers[t.id].setPopupContent(popupHtml(t));
  });
  applyFilter();
}

function applyFilter(){
  const f=document.getElementById('filtro-del').value;
  TIENDAS.forEach(t=>{
    const dels=(asig[t.id]?.delegados)||[];
    markers[t.id]?.setOpacity(!f||dels.includes(f)?1:0.18);
  });
}

function buildLegend(){
  const leg=document.getElementById('legend');
  leg.innerHTML='';
  delegados.forEach(d=>{
    const c=color(d),cnt=TIENDAS.filter(t=>(asig[t.id]?.delegados||[]).includes(d)).length;
    leg.innerHTML+=`<div class='leg-item'><div class='leg-dot' style='background:${c}'></div><span>${d}${cnt>0?' ('+cnt+')':''}</span></div>`;
  });
  leg.innerHTML+=`<div class='leg-item'><div class='leg-dot' style='background:#C8C8C0'></div><span>Sin asignar</span></div>`;
}

function buildDelList(){
  const el=document.getElementById('del-list');
  el.innerHTML='';
  delegados.forEach((d,i)=>{
    const c=PALETTE[i%PALETTE.length],cnt=TIENDAS.filter(t=>(asig[t.id]?.delegados||[]).includes(d)).length;
    el.innerHTML+=`<div class='delegado-row'>
      <div class='d-dot' style='background:${c}'></div>
      <span class='d-name'>${d}</span>
      <span class='d-count'>${cnt}</span>
      ${modo==='admin'?`<button class='btn btn-red' onclick='removeDelegado("${d}")' title='Eliminar'>✕</button>`:''}
    </div>`;
  });
  document.getElementById('add-del-form').style.display=modo==='admin'?'flex':'none';
  const sel=document.getElementById('filtro-del'),prev=sel.value;
  sel.innerHTML='<option value="">Todos los delegados</option>';
  delegados.forEach(d=>{sel.innerHTML+=`<option value='${d}'${d===prev?' selected':''}>${d}</option>`;});
  sel.onchange=()=>{applyFilter();if(modo==='pub')buildCards();};
}

function addDelegado(){
  const inp=document.getElementById('new-del-input'),name=inp.value.trim();
  if(!name||delegados.includes(name))return;
  delegados.push(name);save();inp.value='';
  buildDelList();buildLegend();buildCards();
}

function removeDelegado(name){
  if(!confirm(`¿Eliminar a ${name}? Se quitará de todas las asignaciones de esta semana.`))return;
  delegados=delegados.filter(d=>d!==name);
  Object.keys(asig).forEach(id=>{if(asig[id].delegados)asig[id].delegados=asig[id].delegados.filter(d=>d!==name);});
  save();buildDelList();buildLegend();buildCards();refreshMarkers();updateStats();
}

function buildCards(){
  const grid=document.getElementById('cards-grid'),f=document.getElementById('filtro-del').value;
  grid.innerHTML='';
  const title=document.getElementById('panel-title');

  if(modo==='pub'){
    title.textContent=f?`Tiendas asignadas a ${f}`:'Todas las asignaciones de la semana';
    const lista=TIENDAS.filter(t=>{const dels=(asig[t.id]?.delegados||[]);return f?dels.includes(f):dels.length>0;});
    if(!lista.length){grid.innerHTML=`<div class='empty-msg'>No hay tiendas asignadas${f?' para '+f:''} esta semana.</div>`;return;}
    lista.forEach(t=>{
      const a=asig[t.id]||{},dels=a.delegados||[];
      const chips=dels.map(d=>{const c=color(d);return `<span style='background:${c};color:${textColor(c)};padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600'>${d}</span>`;}).join('');
      grid.innerHTML+=`<div class='tcard' style='border-left:3px solid ${dels[0]?color(dels[0]):"#ccc"}'>
        <div class='tcard-name'>${t.name}</div>
        <div class='tcard-code'>Cód. ${t.id}</div>
        <div style='display:flex;flex-wrap:wrap;gap:3px;margin:5px 0'>${chips||'<span style="font-size:11px;color:#bbb">Sin asignar</span>'}</div>
        ${a.dia?`<div style='font-size:12px;color:#666'>📅 ${formatDate(a.dia)}</div>`:''}
        ${a.visitada?`<div style='font-size:12px;color:#1D9E75;font-weight:600;margin-top:3px'>✓ Visitada</div>`:''}
      </div>`;
    });
    return;
  }

  title.textContent='Asignar tiendas — añade delegados y día de visita';
  const lista=f?TIENDAS.filter(t=>(asig[t.id]?.delegados||[]).includes(f)):TIENDAS;
  if(!lista.length&&f){grid.innerHTML=`<div class='empty-msg'>No hay tiendas asignadas a ${f} esta semana.</div>`;return;}

  lista.forEach(t=>{
    const a=asig[t.id]||{},dels=a.delegados||[];
    const chips=dels.map(d=>{const c=color(d);return `<span class='chip' style='background:${c};color:${textColor(c)}' onclick='removeFromTienda(${t.id},"${d}")'>${d}<span class='chip-x'>✕</span></span>`;}).join('');
    const opts=delegados.filter(d=>!dels.includes(d)).map(d=>`<option value='${d}'>${d}</option>`).join('');
    const div=document.createElement('div');
    div.className='tcard';div.id='card-'+t.id;
    div.style.borderLeft=`3px solid ${dels.length?color(dels[0]):'#e0e0d8'}`;
    div.innerHTML=`<div class='tcard-name'>${t.name}</div>
      <div class='tcard-code'>Cód. ${t.id}</div>
      <div class='chips'>${chips||'<span style="font-size:11px;color:#bbb">Sin asignar</span>'}</div>
      <select onchange='addToDelegado(${t.id},this)'><option value=''>+ Añadir delegado/a...</option>${opts}</select>
      <input type='date' value='${a.dia||''}' onchange='setDia(${t.id},this.value)'>
      <label class='visited-row'><input type='checkbox' ${a.visitada?'checked':''} onchange='setVisitada(${t.id},this.checked)'> Marcar como visitada</label>`;
    grid.appendChild(div);
  });
}

function addToDelegado(id,sel){
  const name=sel.value;if(!name)return;
  if(!asig[id])asig[id]={};
  if(!asig[id].delegados)asig[id].delegados=[];
  if(!asig[id].delegados.includes(name))asig[id].delegados.push(name);
  save();refreshMarkers();buildCards();buildDelList();buildLegend();updateStats();
}

function removeFromTienda(id,name){
  if(!asig[id]?.delegados)return;
  asig[id].delegados=asig[id].delegados.filter(d=>d!==name);
  save();refreshMarkers();buildCards();buildDelList();buildLegend();updateStats();
}

function setDia(id,val){
  if(!asig[id])asig[id]={};
  asig[id].dia=val;save();
  markers[id]?.setPopupContent(popupHtml(TIENDAS.find(t=>t.id===id)));
}

function setVisitada(id,val){
  if(!asig[id])asig[id]={};
  asig[id].visitada=val;save();refreshMarkers();updateStats();
}

function updateStats(){
  const asigN=TIENDAS.filter(t=>(asig[t.id]?.delegados||[]).length>0).length;
  const visitN=TIENDAS.filter(t=>asig[t.id]?.visitada).length;
  document.getElementById('st-asig').textContent=asigN;
  document.getElementById('st-pend').textContent=31-asigN;
  document.getElementById('st-visit').textContent=visitN;
}

function toggleModo(){
  modo=modo==='admin'?'pub':'admin';
  document.getElementById('mode-badge').textContent=modo==='admin'?'Modo admin':'Vista pública';
  document.getElementById('mode-badge').className='mode-badge '+(modo==='admin'?'mode-admin':'mode-pub');
  document.getElementById('btn-modo').textContent=modo==='admin'?'Vista pública':'Modo admin';
  buildDelList();buildCards();
}

function onSemanaChange(){
  semana=document.getElementById('semana-input').value;
  load();refreshMarkers();buildDelList();buildLegend();buildCards();updateStats();
}

document.addEventListener('DOMContentLoaded',()=>{
  semana=getWeekStr();
  document.getElementById('semana-input').value=semana;
  document.getElementById('semana-input').onchange=onSemanaChange;
  load();initMap();buildDelList();buildLegend();buildCards();updateStats();
});
</script>
</body>
</html>
